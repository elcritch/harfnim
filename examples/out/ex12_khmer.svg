<text x="90" y="800" font-size="14" fill="#22223b" text-anchor="start">AE (gid 180) jumps before KHA while COENG and MO merge into gid 252 below the baseline; RO never moves.</text>
<text x="90" y="822" font-size="14" fill="#22223b" text-anchor="start">Clusters 0 and 12 survive the reorder, so hit testing maps back to logical text.</text>
<text x="48" y="898" font-size="13" fill="#8d99ae" text-anchor="start">The Khmer shaper reorders the left vowel first, then fuses Coeng pairs with pref and below-base forms.</text>
