<text x="90" y="960" font-size="14" fill="#22223b" text-anchor="start">Each run shapes with an explicit direction, bypassing segment guessing.</text>
<text x="90" y="982" font-size="14" fill="#22223b" text-anchor="start">Orange connectors follow VisualText.map from each source byte to its visual glyph.</text>
<text x="48" y="998" font-size="13" fill="#8d99ae" text-anchor="start">visualRuns returns visual order text, a per byte source map with sentinel, and maximal level runs.</text>
