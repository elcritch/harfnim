<rect x="0" y="0" width="1280" height="780" fill="#ffffff"/>
<text x="48" y="44" font-size="30" fill="#22223b" text-anchor="start" font-weight="bold">Ligature: GSUB merges f + i into fi</text>
<text x="48" y="70" font-size="15" fill="#8d99ae" text-anchor="start">Synthetic demo font at 440px: blocky f, i, and fi glyphs with a type 4 ligature lookup.</text>
<text x="90" y="220" font-size="20" fill="#22223b" text-anchor="start" font-weight="bold">liga off: two glyphs</text>
<line x1="70" y1="600" x2="550" y2="600" stroke="#d00000" stroke-width="2"/>
<rect x="133" y="293" width="147" height="307" fill="none" stroke="#8338ec" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M134 600 L186.8 600 L186.8 292 L134 292 Z M134 388.8 L279.2 388.8 L279.2 353.6 L134 353.6 Z " fill="#eef1ff" stroke="#22223b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="90" cy="600" r="5" fill="#4361ee" stroke="#ffffff" stroke-width="2"/>
<line x1="90" y1="652" x2="310" y2="652" stroke="#2a9d8f" stroke-width="2.5" marker-end="url(#arrGreen)"/>
