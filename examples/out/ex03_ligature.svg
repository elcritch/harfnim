<text x="916" y="190" font-size="14" fill="#ff8500" text-anchor="middle">cluster 0</text>
<text x="916" y="166" font-size="13" fill="#22223b" text-anchor="middle">gid 20</text>
<text x="90" y="700" font-size="14" fill="#22223b" text-anchor="start">Lookup type 4 (ligature set): coverage {f} + components {i} -&gt; gid 20.</text>
<text x="90" y="724" font-size="14" fill="#22223b" text-anchor="start">The result carries cluster 0 (minimum of 0 and 1) and the ligature bit.</text>
<text x="48" y="758" font-size="13" fill="#8d99ae" text-anchor="start">Substitution happens before positioning: the fi glyph gets its own advance (800 units) and extents.</text>
